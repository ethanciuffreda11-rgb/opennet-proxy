<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OpenNet</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/baremux/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="/">OpenNet</a>
  </header>

  <main class="hero" id="home">
    <h1 class="logo">OpenNet</h1>
    <p class="tag">Search or open any site. Built for Chromebooks — Discord, YouTube, and normal pages load through Ultraviolet.</p>

    <form id="uv-form" class="search" autocomplete="off">
      <input id="uv-search-engine" type="hidden" value="https://duckduckgo.com/?q=%s" />
      <label class="sr" for="uv-address">Search or URL</label>
      <input id="uv-address" type="text" placeholder="Search or paste a URL…" autofocus enterkeyhint="go" spellcheck="false" />
      <button type="submit">Go</button>
    </form>

    <p id="uv-error" class="err"></p>
    <pre id="uv-error-code" class="err-code"></pre>
    <p class="hint">First open can take a few seconds while the service worker installs. Bookmark this page.</p>
  </main>

  <div id="browser" class="browser" hidden>
    <div class="bar">
      <button type="button" id="btn-home" title="Home">Home</button>
      <button type="button" id="btn-reload" title="Reload">Reload</button>
      <input id="omnibox" type="text" readonly />
      <a class="brand-mini" href="/">OpenNet</a>
    </div>
    <iframe id="uv-frame" title="Proxied site"></iframe>
  </div>

  <script src="/register-sw.js"></script>
  <script src="/search.js"></script>
  <script src="/app.js"></script>
</body>
</html>
